spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: minha-gibiteca
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minha_gibiteca}
    username: ${DB_USERNAME:minha_gibiteca}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 260MB
  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  rclone:
    enabled: ${RCLONE_ENABLED:false}
    executable: ${RCLONE_EXECUTABLE:rclone}
    config-directory: ${RCLONE_CONFIG_DIRECTORY:./data/rclone}
  onedrive:
    enabled: ${ONEDRIVE_ENABLED:false}
    client-id: ${ONEDRIVE_CLIENT_ID:}
    client-secret: ${ONEDRIVE_CLIENT_SECRET:}
    redirect-uri: ${ONEDRIVE_REDIRECT_URI:}
    token-key: ${ONEDRIVE_TOKEN_KEY:}
  isbn:
    user-agent: ${ISBN_USER_AGENT:MinhaGibiteca/0.1}
    google-books-api-key: ${GOOGLE_BOOKS_API_KEY:}
  cover-storage-path: ${COVER_STORAGE_PATH:./data/capas}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
