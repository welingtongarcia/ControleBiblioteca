<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Edição</title></head><body><main class="content form-content"><h1 th:text="${pageTitle}"></h1><form class="stack" th:action="${formAction}" th:object="${editionForm}" method="post"><div class="field"><label>Título</label><input th:field="*{title}" required><p class="field-error" th:errors="*{title}"></p></div><div class="field"><label>Número editorial</label><input th:field="*{editorialNumber}" placeholder="Ex.: 1A, 1/2"></div><div class="field"><label>Variante</label><input th:field="*{variant}"></div><div class="year-grid"><div class="field"><label>ISBN</label><input th:field="*{isbn}"></div><div class="field"><label>Ano</label><input th:field="*{publicationYear}" type="number"></div></div><div class="field"><label>Formato</label><input th:field="*{format}" placeholder="Mensal, encadernado..."></div><div class="field"><label>Editora</label><select th:field="*{publisherId}"><option value="">Não definida</option><option th:each="p:${publishers}" th:value="${p.id}" th:text="${p.name}"></option></select></div><div class="field"><label>Série</label><select th:field="*{seriesId}"><option value="">Não definida</option><option th:each="s:${seriesPage.content}" th:value="${s.id}" th:text="${s.name}"></option></select></div><div class="field"><label>Observações</label><textarea th:field="*{notes}"></textarea></div><button>Salvar</button></form></main></body></html>
