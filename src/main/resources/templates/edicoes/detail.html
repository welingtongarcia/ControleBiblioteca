<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${edition.title})}">
    <title>Edição | Minha Gibiteca</title>
</head>
<body>
<main class="content" aria-labelledby="page-title">
    <a class="brand" th:href="@{/edicoes}">Minha Gibiteca</a>
    <div class="page-heading">
        <div>
            <p class="eyebrow">Edição</p>
            <h1 id="page-title" th:text="${edition.title}">Título da edição</h1>
        </div>
        <a class="button-link" th:href="@{/edicoes/{id}/editar(id=${edition.id})}">Editar edição</a>
    </div>
    <p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p>
    <p class="alert alert-error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></p>
    <section class="cover-section" aria-labelledby="cover-title">
        <h2 id="cover-title">Capa</h2>
        <img class="edition-cover" th:if="${edition.coverFileName}" th:src="@{/edicoes/{id}/capa(id=${edition.id})}" alt="Capa da edição"/>
        <p th:unless="${edition.coverFileName}">Nenhuma capa cadastrada.</p>
        <form class="stack" th:action="@{/edicoes/{id}/capa(id=${edition.id})}" method="post" enctype="multipart/form-data">
            <div class="field"><label for="cover">Imagem da capa</label><input id="cover" name="cover" type="file" accept="image/png,image/jpeg" required><p class="help-text">Envie um arquivo PNG ou JPEG de até 5 MB.</p></div>
            <button type="submit">Enviar capa</button>
        </form>
    </section>
    <dl class="details-list">
        <dt>Número editorial</dt><dd th:text="${edition.editorialNumber ?: 'Não informado'}"></dd>
        <dt>Variação da edição</dt><dd th:text="${edition.variant ?: 'Não informada'}"></dd>
        <dt>ISBN</dt><dd th:text="${edition.isbn ?: 'Não informado'}"></dd>
        <dt>Ano de publicação</dt><dd th:text="${edition.publicationYear ?: 'Não informado'}"></dd>
        <dt>Formato</dt><dd th:text="${edition.format ?: 'Não informado'}"></dd>
        <dt>Observações</dt><dd th:text="${edition.notes ?: 'Nenhuma observação cadastrada'}"></dd>
    </dl>
    <section class="details-section" aria-labelledby="works-title">
        <h2 id="works-title">Obras</h2>
        <p th:if="${works.empty}">Nenhuma obra associada.</p>
        <ul th:unless="${works.empty}"><li th:each="work : ${works}" th:text="${work.title}"></li></ul>
    </section>
    <section class="details-section" aria-labelledby="creators-title">
        <h2 id="creators-title">Criadores</h2>
        <p th:if="${creators.empty}">Nenhum criador associado.</p>
        <ul th:unless="${creators.empty}"><li th:each="creator : ${creators}" th:text="${creator.name}"></li></ul>
    </section>
    <form th:action="@{/edicoes/{id}/excluir(id=${edition.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="link-button" type="submit">Excluir edição</button>
    </form>
</main>
</body>
</html>
