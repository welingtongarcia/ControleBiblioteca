<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Edições')}"><title>Edições</title></head><body><main class="content"><a class="brand" th:href="@{/dashboard}">Minha Gibiteca</a><div class="page-heading"><h1>Edições</h1><a class="button-link" th:href="@{/edicoes/nova}">Nova edição</a></div><form class="search-form" method="get"><label for="q">Buscar edição</label><input id="q" name="q" th:value="${query}"><button>Buscar</button></form><section th:if="${editions.empty}" class="empty-state"><h2>Nenhuma edição encontrada</h2></section><ul class="resource-list" th:unless="${editions.empty}"><li th:each="edition:${editions.content}"><a th:href="@{/edicoes/{id}(id=${edition.id})}" th:text="${edition.title}"></a><span th:text="${edition.editorialNumber}"></span></li></ul></main></body></html>
