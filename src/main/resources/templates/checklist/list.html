<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Checklist</title></head>
<body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${pageTitle + ': ' + series.name}, ${missingOnly ? 'Checklist de ' + series.name : null}, ${missingOnly ? '/series/' + series.id + '/checklist' : null})}"></div>


    <h1 id="page-title" th:text="${pageTitle}"></h1><h2 th:text="${series.name}"></h2>
    <nav class="form-actions section-tabs" aria-label="Consulta da série"><a th:href="@{/series/{id}/checklist(id=${series.id},returnTo=${navigation.pageReturnUrl})}" th:attr="aria-current=${!missingOnly ? 'page' : null}">Checklist completo</a><a th:href="@{/series/{id}/faltantes(id=${series.id},returnTo=${navigation.pageReturnUrl})}" th:attr="aria-current=${missingOnly ? 'page' : null}">Quadrinhos faltantes</a></nav>
    <p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p>
    <p class="help-text">Somente números cadastrados por você são listados. Exemplares não alteram este checklist automaticamente.</p>
    <p class="empty-state" th:if="${items.empty}" th:text="${missingOnly ? 'Nenhum item marcado como Não possuo nesta página. Cadastre os números conhecidos no checklist completo.' : 'Nenhum item nesta página. Cadastre os números editoriais conhecidos abaixo.'}"></p>
    <ul class="resource-list checklist-list" th:unless="${items.empty}"><li th:each="item : ${items}">
        <div><strong th:text="${item.editorialNumber}"></strong><span th:text="${item.label}"></span><p th:text="${item.ownedLabel}"></p><p th:if="${item.notes}" th:text="${item.notes}"></p></div>
        <div class="resource-actions"><a th:href="@{/checklist/itens/{id}/editar(id=${item.id},returnTo=${navigation.pageReturnUrl})}" th:attr="aria-label=|Editar item ${item.editorialNumber}|">Editar</a><a th:href="@{/checklist/itens/{id}/excluir(id=${item.id},returnTo=${navigation.pageReturnUrl})}" th:attr="aria-label=|Excluir item ${item.editorialNumber}|">Excluir</a></div>
    </li></ul>
    <nav class="pagination" th:if="${items.totalPages > 1}" aria-label="Paginação do checklist">
        <a th:if="${items.hasPrevious()}" th:href="@{${listPath}(page=${items.number - 1},returnTo=${navigation.pageReturnUrl})}">Anterior</a>
        <span th:text="|Página ${items.number + 1} de ${items.totalPages}|"></span>
        <a th:if="${items.hasNext()}" th:href="@{${listPath}(page=${items.number + 1},returnTo=${navigation.pageReturnUrl})}">Próxima</a>
    </nav>
    <section class="details-section form-content" th:unless="${missingOnly}" aria-labelledby="new-item-title">
        <h2 id="new-item-title">Adicionar item</h2><form th:replace="~{checklist/form :: entryForm}"></form>
    </section>
</main></div></body></html>
