<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Personagens')}"><title>Minha Gibiteca</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content page-content " aria-labelledby="page-title"><div th:replace="~{fragments/navigation :: breadcrumbs('Personagens', null, null)}"></div>
 <div class="page-heading"><div><p class="eyebrow">Cadastros de apoio</p><h1 id="page-title">Personagens</h1><p class="muted">Cadastre personagens e vincule-os às edições para analisar suas compras.</p></div><a class="button-link" th:href="@{/personagens/novo(returnTo=${navigation.pageReturnUrl})}">Novo personagem</a></div><p class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p><p class="alert alert-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
 <form class="search-form" method="get" th:action="@{/personagens}"><label for="q">Buscar personagem</label><input id="q" name="q" th:value="${query}" type="search" maxlength="180"><button type="submit">Buscar</button><a th:href="@{/personagens}">Limpar</a></form>
 <p role="status" th:text="|${characters.totalElements} personagens encontrados|"></p><div class="empty-state" th:if="${characters.empty}"><p>Nenhum personagem nesta consulta. Você pode cadastrar e depois vincular em Editar edição.</p></div>
 <ul class="resource-list"><li th:each="item : ${characters.content}"><strong th:text="${item.name}"></strong><div class="resource-actions"><a th:href="@{/personagens/{id}/editar(id=${item.id},returnTo=${navigation.pageReturnUrl})}">Editar</a><a th:href="@{/personagens/{id}/excluir(id=${item.id},returnTo=${navigation.pageReturnUrl})}">Excluir</a><a th:href="@{/financeiro(characterId=${item.id})}">Ver compras</a></div></li></ul>
 <nav class="pagination" th:if="${characters.totalPages > 1}" aria-label="Paginação dos personagens"><a th:if="${characters.hasPrevious()}" th:href="@{/personagens(q=${query},page=${characters.number-1})}">Anterior</a><span th:text="|Página ${characters.number+1} de ${characters.totalPages}|"></span><a th:if="${characters.hasNext()}" th:href="@{/personagens(q=${query},page=${characters.number+1})}">Próxima</a></nav></main></div></body></html>
