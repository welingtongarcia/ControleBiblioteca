<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Minha Gibiteca</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content page-content form-content" aria-labelledby="page-title"><div th:replace="~{fragments/navigation :: breadcrumbs(${pageTitle}, null, null)}"></div>
 <h1 id="page-title" th:text="${pageTitle}"></h1><form class="stack" method="post" th:action="${formAction}" th:object="${characterForm}"><input type="hidden" name="returnTo" th:value="${navigation.pageReturnUrl}"><div class="field"><label for="name">Nome do personagem</label><input id="name" th:field="*{name}" maxlength="180" required th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name')?'name-error':null}"><p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div><p class="help-text">Após salvar, vincule o personagem no formulário da edição. Não inferimos personagens pelo título.</p><div class="form-actions"><button type="submit">Salvar personagem</button><a th:href="@{${navigation.returnUrl}}">Cancelar</a></div></form></main></div></body></html>
