<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Excluir personagem')}"><title>Minha Gibiteca</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content page-content form-content" aria-labelledby="page-title"><div th:replace="~{fragments/navigation :: breadcrumbs('Excluir personagem', null, null)}"></div>
 <h1 id="page-title">Excluir personagem</h1><p class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p><p class="alert alert-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p><p th:text="|Excluir ${character.name}? Personagens vinculados a edições não podem ser excluídos.|"></p><form class="stack" method="post" th:action="@{/personagens/{id}/excluir(id=${character.id})}"><input type="hidden" name="returnTo" th:value="${navigation.pageReturnUrl}"><label><input type="checkbox" name="confirmed" value="true" required> Confirmo a exclusão deste personagem.</label><div class="form-actions"><button type="submit">Excluir personagem</button><a th:href="@{${navigation.returnUrl}}">Cancelar</a></div></form></main></div></body></html>
