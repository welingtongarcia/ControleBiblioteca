<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Localização</title></head>
<body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content form-content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${pageTitle}, null, null)}"></div>


    <h1 id="page-title" th:text="${pageTitle}">Nova localização</h1><p class="help-text">Nome e tipo são obrigatórios. Organize onde seus exemplares físicos ficam guardados.</p>
    <form class="stack" th:action="${formAction}" th:object="${locationForm}" method="post"><input type="hidden" name="returnTo" th:value="${navigation.pageReturnUrl}">
        <div th:replace="~{fragments/forms :: errors}"></div>
        <div class="field">
            <label for="name">Nome <span aria-hidden="true">*</span></label>
            <input id="name" th:field="*{name}" maxlength="120" required th:attr="aria-invalid=${#fields.hasErrors('name') ? 'true' : null},aria-describedby=${#strings.trim('' + (#fields.hasErrors('name') ? ' name-error' : ''))}">
            <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="level">Tipo <span aria-hidden="true">*</span></label>
            <select id="level" th:field="*{level}" required th:attr="aria-invalid=${#fields.hasErrors('level') ? 'true' : null},aria-describedby=${#strings.trim('' + (#fields.hasErrors('level') ? ' level-error' : ''))}">
                <option th:each="level : ${levels}" th:value="${level}" th:text="${level.label}"></option>
            </select>
            <p id="level-error" class="field-error" th:if="${#fields.hasErrors('level')}" th:errors="*{level}"></p>
        </div>
        <div class="field">
            <label for="parentId">Dentro de</label>
            <select id="parentId" th:field="*{parentId}" th:attr="aria-invalid=${#fields.hasErrors('parentId') ? 'true' : null},aria-describedby=${#strings.trim('' + ' parent-help' + (#fields.hasErrors('parentId') ? ' parent-error' : ''))}">
                <option value="">Sem localização superior</option>
                <option th:each="parent : ${parents}" th:value="${parent.id}" th:text="|${parent.path} (${parent.level.label})|"></option>
            </select>
            <p id="parent-help" class="help-text">Ordem: cômodo → estante → prateleira → caixa. Você pode pular níveis ou cadastrar uma localização independente.</p>
            <p id="parent-error" class="field-error" th:if="${#fields.hasErrors('parentId')}" th:errors="*{parentId}"></p>
        </div>
        <div class="field">
            <label for="notes">Observações</label>
            <textarea id="notes" th:field="*{notes}" maxlength="2000" rows="4" th:attr="aria-invalid=${#fields.hasErrors('notes') ? 'true' : null},aria-describedby=${#strings.trim('' + (#fields.hasErrors('notes') ? ' notes-error' : ''))}"></textarea>
            <p id="notes-error" class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>
        </div>
        <div class="form-actions"><button type="submit">Salvar localização</button><a th:href="@{${navigation.returnUrl}}">Cancelar</a></div>
    </form>
</main></div></body></html>
