<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Excluir exemplar')}"><title>Excluir exemplar</title></head>
<body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content form-content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs('Excluir exemplar', ${edition.title}, ${'/edicoes/' + edition.id})}"></div>


    <h1 id="page-title">Excluir exemplar</h1>
    <p>Excluir este exemplar de <strong th:text="${edition.title}"></strong>?</p>
    <dl class="details-list">
        <dt>Conservação</dt><dd th:text="${copy.condition.label}"></dd>
        <dt>Localização</dt><dd th:text="${copy.locationPath}"></dd>
        <dt>Valor pago</dt><dd th:text="${copy.formattedPrice}"></dd>
    </dl>
    <p>A exclusão é permanente. A edição e os demais exemplares serão preservados.</p>
    <form class="stack" th:action="@{/exemplares/{id}/excluir(id=${copy.id})}" method="post"><input type="hidden" name="returnTo" th:value="${navigation.pageReturnUrl}">
        <label><input type="checkbox" name="confirmed" value="true" required> Confirmo a exclusão deste exemplar.</label>
        <div class="form-actions"><button type="submit">Excluir exemplar</button><a th:href="@{${navigation.parentUrl('/edicoes/' + edition.id)}}">Cancelar</a></div>
    </form>
</main></div></body></html>
