<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Série</title></head><body>
<main class="content form-content" aria-labelledby="page-title"><a class="brand" th:href="@{/series}">Minha Gibiteca</a><h1 id="page-title" th:text="${pageTitle}">Nova série</h1>
<form class="stack" th:action="${formAction}" th:object="${seriesForm}" method="post"><p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{publicationPeriodValid}"></p>
<div class="field"><label for="name">Nome <span aria-hidden="true">*</span></label><input id="name" th:field="*{name}" maxlength="180" required><p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div>
<div class="field"><label for="publisherId">Editora</label><select id="publisherId" th:field="*{publisherId}"><option value="">Não definida</option><option th:each="publisher : ${publishers}" th:value="${publisher.id}" th:text="${publisher.name}"></option></select></div>
<div class="year-grid"><div class="field"><label for="startYear">Ano inicial</label><input id="startYear" th:field="*{startYear}" type="number" min="1800" max="2100"><p class="field-error" th:if="${#fields.hasErrors('startYear')}" th:errors="*{startYear}"></p></div><div class="field"><label for="endYear">Ano final</label><input id="endYear" th:field="*{endYear}" type="number" min="1800" max="2100"><p class="field-error" th:if="${#fields.hasErrors('endYear')}" th:errors="*{endYear}"></p></div></div>
<div class="field"><label for="status">Situação da publicação</label><select id="status" th:field="*{status}"><option value="">Não informada</option><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}"></option></select></div>
<div class="field"><label for="notes">Observações</label><textarea id="notes" th:field="*{notes}" maxlength="2000" rows="5"></textarea></div><div class="form-actions"><button type="submit">Salvar</button><a th:href="@{/series}">Cancelar</a></div></form>
</main></body></html>
