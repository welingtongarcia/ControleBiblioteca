<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Séries')}"><title>Séries</title></head><body>
<main class="content" aria-labelledby="page-title"><a class="brand" th:href="@{/dashboard}">Minha Gibiteca</a>
<div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1 id="page-title">Séries</h1></div><a class="button-link" th:href="@{/series/nova}">Nova série</a></div>
<p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p>
<form class="search-form" method="get" th:action="@{/series}"><label for="q">Buscar série</label><input id="q" name="q" th:value="${query}" type="search" maxlength="180"><button type="submit">Buscar</button></form>
<section th:if="${seriesPage.empty}" class="empty-state"><h2>Nenhuma série encontrada</h2><p>Cadastre uma série editorial para organizar suas edições.</p></section>
<section th:unless="${seriesPage.empty}"><ul class="resource-list"><li th:each="series : ${seriesPage.content}"><div><strong th:text="${series.name}">Série</strong><span th:if="${series.status}" th:text="${series.status}"></span></div><div class="resource-actions"><a th:href="@{/series/{id}/editar(id=${series.id})}">Editar</a><form th:action="@{/series/{id}/excluir(id=${series.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button" type="submit">Excluir</button></form></div></li></ul>
<nav class="pagination" th:if="${seriesPage.totalPages > 1}" aria-label="Paginação"><a th:if="${seriesPage.hasPrevious()}" th:href="@{/series(q=${query},page=${seriesPage.number - 1})}">Anterior</a><span th:text="|Página ${seriesPage.number + 1} de ${seriesPage.totalPages}|"></span><a th:if="${seriesPage.hasNext()}" th:href="@{/series(q=${query},page=${seriesPage.number + 1})}">Próxima</a></nav></section>
</main></body></html>
