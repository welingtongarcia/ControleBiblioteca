<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Criador</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content form-content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${pageTitle}, null, null)}"></div>
<h1 id="page-title" th:text="${pageTitle}">Novo criador</h1><form class="stack" th:action="${formAction}" th:object="${creatorForm}" method="post"><input type="hidden" name="returnTo" th:value="${navigation.pageReturnUrl}"><div class="field"><label for="name">Nome <span aria-hidden="true">*</span></label><input id="name" th:field="*{name}" maxlength="180" required><p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div><div class="field"><label for="sortName">Nome para ordenação</label><input id="sortName" th:field="*{sortName}" maxlength="180" placeholder="Ex.: Sobrenome, Nome"><p class="help-text">Opcional. Use para definir como o nome será ordenado no catálogo.</p><p class="field-error" th:if="${#fields.hasErrors('sortName')}" th:errors="*{sortName}"></p></div><div class="form-actions"><button type="submit">Salvar criador</button><a th:href="@{${navigation.returnUrl}}">Cancelar</a></div></form></main></div></body></html>
