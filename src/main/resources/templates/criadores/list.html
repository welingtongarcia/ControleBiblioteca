<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Criadores')}"><title>Criadores</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${navigation.label}, null, null)}"></div>
<div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1 id="page-title">Criadores</h1><p class="muted">Cadastre autores e artistas, suas funções e vínculos com as edições.</p></div><a class="button-link" th:href="@{/criadores/novo(returnTo=${navigation.pageReturnUrl})}">Novo criador</a></div><p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p><p class="alert alert-error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></p><form class="search-form" method="get"><label for="q">Buscar criador</label><input id="q" name="q" th:value="${query}" type="search" maxlength="180"><button>Buscar</button></form><section th:if="${creators.empty}" class="empty-state"><h2>Nenhum criador encontrado</h2><p>Revise o termo da busca ou use o botão de cadastro para adicionar um criador.</p></section><section th:unless="${creators.empty}"><ul class="resource-list"><li th:each="creator : ${creators.content}"><div class="creator-list-identity"><img class="creator-photo-thumbnail" th:if="${creator.photoFileName}" th:src="@{/criadores/{id}/foto(id=${creator.id})}" th:alt="|Foto de ${creator.name}|" width="64" height="64" loading="lazy"><div><strong th:text="${creator.name}">Criador</strong><span th:if="${creator.sortName}" th:text="${creator.sortName}"></span><p class="help-text" th:text="${creator.functionsDescription}"></p></div></div><div class="resource-actions"><a th:href="@{/criadores/{id}/editar(id=${creator.id},returnTo=${navigation.pageReturnUrl})}">Editar</a><div th:replace="~{fragments/forms :: deleteConfirm(@{/criadores/{id}/excluir(id=${creator.id})}, ${navigation.pageReturnUrl}, ${creator.name})}"></div></div></li></ul><nav class="pagination" th:if="${creators.totalPages > 1}" aria-label="Paginação"><a th:if="${creators.hasPrevious()}" th:href="@{/criadores(q=${query},page=${creators.number - 1})}">Anterior</a><span th:text="|Página ${creators.number + 1} de ${creators.totalPages}|"></span><a th:if="${creators.hasNext()}" th:href="@{/criadores(q=${query},page=${creators.number + 1})}">Próxima</a></nav></section></main></div></body></html>
