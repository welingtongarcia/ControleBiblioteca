<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Criadores')}"><title>Criadores</title></head><body><main class="content" aria-labelledby="page-title"><a class="brand" th:href="@{/dashboard}">Minha Gibiteca</a><div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1 id="page-title">Criadores</h1></div><a class="button-link" th:href="@{/criadores/novo}">Novo criador</a></div><p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p><form class="search-form" method="get"><label for="q">Buscar criador</label><input id="q" name="q" th:value="${query}" type="search" maxlength="180"><button>Buscar</button></form><section th:if="${creators.empty}" class="empty-state"><h2>Nenhum criador encontrado</h2><p>Cadastre roteiristas, desenhistas e outros participantes.</p></section><section th:unless="${creators.empty}"><ul class="resource-list"><li th:each="creator : ${creators.content}"><div><strong th:text="${creator.name}">Criador</strong><span th:if="${creator.sortName}" th:text="${creator.sortName}"></span></div><div class="resource-actions"><a th:href="@{/criadores/{id}/editar(id=${creator.id})}">Editar</a><form th:action="@{/criadores/{id}/excluir(id=${creator.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">Excluir</button></form></div></li></ul><nav class="pagination" th:if="${creators.totalPages > 1}" aria-label="Paginação"><a th:if="${creators.hasPrevious()}" th:href="@{/criadores(q=${query},page=${creators.number - 1})}">Anterior</a><span th:text="|Página ${creators.number + 1} de ${creators.totalPages}|"></span><a th:if="${creators.hasNext()}" th:href="@{/criadores(q=${query},page=${creators.number + 1})}">Próxima</a></nav></section></main></body></html>
