<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Vincular arquivo a uma edição')}"><title>Vincular arquivo</title></head>
<body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content page-content digital-library" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs('Vincular arquivo', null, null)}"></div><h1 id="page-title">Vincular arquivo a uma edição</h1><p class="digital-file-name" th:text="${file.name}"></p><p class="help-text">Escolha uma edição sua. O vínculo não cria outro exemplar nem modifica valores, suporte ou leitura.</p>
<form th:if="${file.editionId}" method="post" th:action="@{/biblioteca-digital/arquivos/{id}/vincular(id=${file.id})}"><button class="button-secondary">Remover vínculo atual</button></form>
<form class="search-form" method="get"><label for="q">Buscar edição por título, ISBN ou número</label><input id="q" name="q" th:value="${query}" maxlength="240" type="search"><button>Buscar</button></form>
<ul class="resource-list"><li th:each="edition : ${editions.content}"><div><strong th:text="${edition.title}"></strong><p th:if="${edition.editorialNumber}" th:text="|Nº ${edition.editorialNumber}|"></p></div><form method="post" th:action="@{/biblioteca-digital/arquivos/{id}/vincular(id=${file.id})}"><input type="hidden" name="editionId" th:value="${edition.id}"><button th:aria-label="|Vincular a ${edition.title}|">Vincular esta edição</button></form></li></ul>
<p th:if="${editions.empty}">Nenhuma edição encontrada. Cadastre a publicação no catálogo antes de vinculá-la.</p>
<nav class="pagination" th:if="${editions.totalPages > 1}" aria-label="Paginação das edições"><a th:if="${editions.hasPrevious()}" th:href="@{/biblioteca-digital/arquivos/{id}/vincular(id=${file.id},q=${query},page=${editions.number - 1})}">Anterior</a><span th:text="|Página ${editions.number + 1} de ${editions.totalPages}|"></span><a th:if="${editions.hasNext()}" th:href="@{/biblioteca-digital/arquivos/{id}/vincular(id=${file.id},q=${query},page=${editions.number + 1})}">Próxima</a></nav>
<a class="button-link button-secondary" th:href="@{/biblioteca-digital}">Voltar à biblioteca digital</a>
</main></div></body></html>
