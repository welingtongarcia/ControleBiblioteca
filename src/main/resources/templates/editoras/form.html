<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Editoras</title></head>
<body>
<main class="content form-content" aria-labelledby="page-title">
    <a class="brand" th:href="@{/editoras}">Minha Gibiteca</a>
    <h1 id="page-title" th:text="${pageTitle}">Nova editora</h1>
    <form class="stack" th:action="${formAction}" th:object="${publisherForm}" method="post">
        <div class="field">
            <label for="name">Nome <span aria-hidden="true">*</span></label>
            <input id="name" th:field="*{name}" maxlength="160" required aria-describedby="name-error">
            <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="countryCode">País (sigla ISO)</label>
            <input id="countryCode" th:field="*{countryCode}" maxlength="2" placeholder="BR" aria-describedby="country-error">
            <p id="country-error" class="field-error" th:if="${#fields.hasErrors('countryCode')}" th:errors="*{countryCode}"></p>
        </div>
        <div class="field">
            <label for="notes">Observações</label>
            <textarea id="notes" th:field="*{notes}" maxlength="2000" rows="5" aria-describedby="notes-error"></textarea>
            <p id="notes-error" class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></p>
        </div>
        <div class="form-actions"><button type="submit">Salvar</button><a th:href="@{/editoras}">Cancelar</a></div>
    </form>
</main>
</body>
</html>
