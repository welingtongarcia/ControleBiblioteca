<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editoras')}"><title>Editoras</title></head>
<body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside>
<main id="main-content" tabindex="-1" class="content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${navigation.label}, null, null)}"></div>


    <div class="page-heading">
        <div><p class="eyebrow">Catálogo</p><h1 id="page-title">Editoras</h1><p class="muted">Organize as editoras responsáveis pelas publicações do seu acervo.</p></div>
        <a class="button-link" th:href="@{/editoras/nova(returnTo=${navigation.pageReturnUrl})}">Nova editora</a>
    </div>
    <p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p>
    <p class="alert alert-error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></p>
    <form class="search-form" method="get" th:action="@{/editoras}">
        <label for="q">Buscar editora</label>
        <input id="q" name="q" th:value="${query}" type="search" maxlength="160">
        <button type="submit">Buscar</button>
    </form>
    <section th:if="${publishers.empty}" class="empty-state" aria-live="polite">
        <h2>Nenhuma editora encontrada</h2>
        <p>Revise o termo da busca ou use o botão de cadastro para adicionar uma editora.</p>
    </section>
    <section th:unless="${publishers.empty}" aria-label="Editoras cadastradas">
        <ul class="resource-list">
            <li th:each="publisher : ${publishers.content}">
                <div><strong th:text="${publisher.name}">Editora</strong><span th:if="${publisher.countryCode}" th:text="${publisher.countryCode}"></span></div>
                <div class="resource-actions">
                    <a th:href="@{/editoras/{id}/editar(id=${publisher.id},returnTo=${navigation.pageReturnUrl})}">Editar</a>
                    <div th:replace="~{fragments/forms :: deleteConfirm(@{/editoras/{id}/excluir(id=${publisher.id})}, ${navigation.pageReturnUrl}, ${publisher.name})}"></div>
                </div>
            </li>
        </ul>
        <nav class="pagination" th:if="${publishers.totalPages > 1}" aria-label="Paginação">
            <a th:if="${publishers.hasPrevious()}" th:href="@{/editoras(q=${query},page=${publishers.number - 1})}">Anterior</a>
            <span th:text="|Página ${publishers.number + 1} de ${publishers.totalPages}|"></span>
            <a th:if="${publishers.hasNext()}" th:href="@{/editoras(q=${query},page=${publishers.number + 1})}">Próxima</a>
        </nav>
    </section>
</main></div>
</body>
</html>
