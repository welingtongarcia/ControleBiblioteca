<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Obras')}"><title>Obras</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside>
<main id="main-content" tabindex="-1" class="content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${navigation.label}, null, null)}"></div>
<div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1 id="page-title">Obras</h1><p class="muted">Reúna as histórias e vincule cada obra às suas edições.</p></div><a class="button-link" th:href="@{/obras/nova(returnTo=${navigation.pageReturnUrl})}">Nova obra</a></div>
<p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p><p class="alert alert-error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></p><form class="search-form" method="get"><label for="q">Buscar obra</label><input id="q" name="q" th:value="${query}" type="search" maxlength="240"><button>Buscar</button></form>
<section th:if="${works.empty}" class="empty-state"><h2>Nenhuma obra encontrada</h2><p>Revise o termo da busca ou use o botão de cadastro para adicionar uma obra.</p></section><section th:unless="${works.empty}"><ul class="resource-list"><li th:each="work : ${works.content}"><div><strong th:text="${work.title}">Obra</strong><span th:if="${work.originalYear}" th:text="${work.originalYear}"></span></div><div class="resource-actions"><a th:href="@{/obras/{id}/editar(id=${work.id},returnTo=${navigation.pageReturnUrl})}">Editar</a><div th:replace="~{fragments/forms :: deleteConfirm(@{/obras/{id}/excluir(id=${work.id})}, ${navigation.pageReturnUrl}, ${work.title})}"></div></div></li></ul><nav class="pagination" th:if="${works.totalPages > 1}" aria-label="Paginação"><a th:if="${works.hasPrevious()}" th:href="@{/obras(q=${query},page=${works.number - 1})}">Anterior</a><span th:text="|Página ${works.number + 1} de ${works.totalPages}|"></span><a th:if="${works.hasNext()}" th:href="@{/obras(q=${query},page=${works.number + 1})}">Próxima</a></nav></section></main></div></body></html>
