<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Obras')}"><title>Obras</title></head><body>
<main class="content" aria-labelledby="page-title"><a class="brand" th:href="@{/dashboard}">Minha Gibiteca</a><div class="page-heading"><div><p class="eyebrow">Catálogo</p><h1 id="page-title">Obras</h1></div><a class="button-link" th:href="@{/obras/nova}">Nova obra</a></div>
<p class="alert alert-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></p><form class="search-form" method="get"><label for="q">Buscar obra</label><input id="q" name="q" th:value="${query}" type="search" maxlength="240"><button>Buscar</button></form>
<section th:if="${works.empty}" class="empty-state"><h2>Nenhuma obra encontrada</h2><p>Cadastre obras para vinculá-las às suas edições.</p></section><section th:unless="${works.empty}"><ul class="resource-list"><li th:each="work : ${works.content}"><div><strong th:text="${work.title}">Obra</strong><span th:if="${work.originalYear}" th:text="${work.originalYear}"></span></div><div class="resource-actions"><a th:href="@{/obras/{id}/editar(id=${work.id})}">Editar</a><form th:action="@{/obras/{id}/excluir(id=${work.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">Excluir</button></form></div></li></ul><nav class="pagination" th:if="${works.totalPages > 1}" aria-label="Paginação"><a th:if="${works.hasPrevious()}" th:href="@{/obras(q=${query},page=${works.number - 1})}">Anterior</a><span th:text="|Página ${works.number + 1} de ${works.totalPages}|"></span><a th:if="${works.hasNext()}" th:href="@{/obras(q=${query},page=${works.number + 1})}">Próxima</a></nav></section></main></body></html>
