<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Obra</title></head><body class="dashboard-page"><a class="skip-link" href="#main-content">Pular para o conteúdo</a><div class="dashboard-layout"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main id="main-content" tabindex="-1" class="content form-content page-content" aria-labelledby="page-title">
<div th:replace="~{fragments/navigation :: breadcrumbs(${pageTitle}, null, null)}"></div>
<h1 id="page-title" th:text="${pageTitle}">Nova obra</h1><p class="help-text">O título é obrigatório. Uma obra pode aparecer em diferentes edições do seu catálogo.</p><form class="stack" th:action="${formAction}" th:object="${workForm}" method="post"><input type="hidden" name="returnTo" th:value="${navigation.pageReturnUrl}">
        <div th:replace="~{fragments/forms :: errors}"></div><div class="field"><label for="title">Título <span aria-hidden="true">*</span></label><input id="title" th:field="*{title}" maxlength="240" required th:attr="aria-invalid=${#fields.hasErrors('title') ? 'true' : null},aria-describedby=${#fields.hasErrors('title') ? 'title-error' : null}"><p id="title-error" class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p></div><div class="field"><label for="originalYear">Ano original</label><input id="originalYear" th:field="*{originalYear}" type="number" min="1" max="2100" th:attr="aria-invalid=${#fields.hasErrors('originalYear') ? 'true' : null},aria-describedby=${#fields.hasErrors('originalYear') ? 'originalYear-error' : null}"><p id="originalYear-error" class="field-error" th:if="${#fields.hasErrors('originalYear')}" th:errors="*{originalYear}"></p></div><div class="field"><label for="summary">Resumo</label><textarea id="summary" th:field="*{summary}" maxlength="4000" rows="6" th:attr="aria-invalid=${#fields.hasErrors('summary') ? 'true' : null},aria-describedby=${#fields.hasErrors('summary') ? 'summary-error' : null}"></textarea><p id="summary-error" class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></p></div><div class="form-actions"><button type="submit">Salvar obra</button><a th:href="@{${navigation.returnUrl}}">Cancelar</a></div></form></main></div></body></html>
