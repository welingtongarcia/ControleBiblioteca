<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${pageTitle})}"><title>Obra</title></head><body><main class="content form-content" aria-labelledby="page-title"><a class="brand" th:href="@{/obras}">Minha Gibiteca</a><h1 id="page-title" th:text="${pageTitle}">Nova obra</h1><form class="stack" th:action="${formAction}" th:object="${workForm}" method="post"><div class="field"><label for="title">Título <span aria-hidden="true">*</span></label><input id="title" th:field="*{title}" maxlength="240" required><p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p></div><div class="field"><label for="originalYear">Ano original</label><input id="originalYear" th:field="*{originalYear}" type="number" min="1" max="2100"><p class="field-error" th:if="${#fields.hasErrors('originalYear')}" th:errors="*{originalYear}"></p></div><div class="field"><label for="summary">Resumo</label><textarea id="summary" th:field="*{summary}" maxlength="4000" rows="6"></textarea><p class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></p></div><div class="form-actions"><button type="submit">Salvar obra</button><a th:href="@{/obras}">Cancelar</a></div></form></main></body></html>
